<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Bootcamp 2026 - Student Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.6s ease-out;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 28px 56px rgba(0, 0, 0, 0.18);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      animation: pulse 2s ease-in-out infinite;
      margin-bottom: 16px;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.5);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(102, 126, 234, 0);
      }
    }

    .name {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .cohort {
      font-size: 16px;
      color: #667eea;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .role {
      font-size: 15px;
      color: #6b6b6b;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">DevOps Bootcamp 2026</div>
    <div class="name">Hariri bin Abdullah</div>
    <div class="cohort">Cohort 2026</div>
    <div class="role">DevOps Engineer</div>
  </div>
</body>
</html>
