- name: Deploy container to webserver
  hosts: webserver
  become: true
  vars:
    ecr_registry: "739951718815.dkr.ecr.ap-southeast-1.amazonaws.com"
    ecr_repo: "devops-bootcamp/final-project-haririabd"
    image_tag: "latest"
    container_name: "final-haririabd"

  roles:
    - geerlingguy.docker

  tasks:
    - name: Install AWS CLI
      apt:
        name: awscli
        state: present
        update_cache: yes

    - name: Login to ECR
      shell: >
        aws ecr get-login-password --region ap-southeast-1
        | docker login --username AWS --password-stdin {{ ecr_registry }}

    - name: Remove existing container if present
      command: docker rm -f {{ container_name }}
      ignore_errors: true

    - name: Run the final-project container
      command: >
        docker run -d --name {{ container_name }}
        --restart always
        -p 80:80
        {{ ecr_registry }}/{{ ecr_repo }}:{{ image_tag }}
